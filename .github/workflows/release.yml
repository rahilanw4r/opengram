name: Build and Release Opengram APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.3'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Opengram
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Free Disk Space & Configure Swap
        run: |
          sudo fallocate -l 6G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=6144 || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          free -h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Install Components
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="sdkmanager"; fi
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Checkout Build Dependencies
        run: |
          set -euxo pipefail
          # media3 must be checked out from the Telegram-compatible fork/branch.
          git clone --depth 1 --branch telegram-v1.10.1-ffmpeg https://github.com/Arseny271/media.git TMessagesProj_Modules/media
          # Pin tgcalls to a known upstream revision; native CMake depends on its Android and audio helper sources.
          git clone https://github.com/TelegramMessenger/tgcalls.git TMessagesProj/jni/tgcalls
          git -C TMessagesProj/jni/tgcalls checkout --detach 38dcea121f10638c42098f226f05c298a392f95c
          test -f TMessagesProj/jni/tgcalls/tgcalls/AudioDeviceHelper.cpp
          test -f TMessagesProj/jni/tgcalls/tgcalls/platform/android/AndroidInterface.cpp
          git clone --depth 1 https://github.com/dkaraush/jlatexmath-android.git TMessagesProj/lib/jlatexmath
          git clone --depth 1 https://chromium.googlesource.com/libyuv/libyuv TMessagesProj/jni/third_party/libyuv
          git clone --depth 1 https://github.com/abseil/abseil-cpp.git TMessagesProj/jni/third_party/absl
          test -f TMessagesProj_Modules/media/core_settings.gradle

      - name: Generate CI Release Keystore
        run: |
          keytool -genkey -v -keystore Your_Key.jks \
            -alias Your_Alias -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass Your_Password -keypass Your_Password \
            -dname "CN=Opengram, OU=Opengram, O=Opengram, L=City, S=State, C=US"

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Standalone APK
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC" \
            -Pandroid.nativeBuild.parallelLevel=2 \
            2>&1 | tee gradle_build.log || {
              echo "=== assembleAfatStandalone failed! Tail of log: ==="
              tail -n 200 gradle_build.log
              echo "Attempting assembleAfatDebug fallback..."
              ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug --stacktrace \
                --no-daemon \
                -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC" \
                -Pandroid.nativeBuild.parallelLevel=2 \
                2>&1 | tee -a gradle_build.log || {
                  echo "=== BUILD FAILED: LAST 200 LINES OF LOG ==="
                  tail -n 200 gradle_build.log
                  echo "## Build Failure Log" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  tail -n 100 gradle_build.log >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  exit 1
                }
            }

      - name: Upload Build Log on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
          if-no-files-found: ignore

      - name: Report Build Failure to Commit Comments
        if: failure()
        run: |
          python3 -c "
          import urllib.request, json, os

          token = os.environ.get('GITHUB_TOKEN', '')
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          sha = os.environ.get('GITHUB_SHA', '')

          collected = []

          # 1. Collect any CMake output / error logs in .cxx
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f in ['build_output.txt', 'cmake_output.txt', 'build_command.txt'] or 'cmake' in f.lower():
                      p = os.path.join(root, f)
                      try:
                          c = open(p, 'r', errors='ignore').read().strip()
                          if c:
                              collected.append(f'=== {p} ===\n' + c[-3000:])
                      except Exception:
                          pass

          # 2. Extract error context lines from gradle_build.log
          if os.path.exists('gradle_build.log'):
              lines = open('gradle_build.log', 'r', errors='ignore').readlines()
              seen_blocks = set()
              for i, line in enumerate(lines):
                  if any(k in line for k in ['CMake Error', 'FAILED:', 'error:', 'fatal error:', '* What went wrong:']):
                      start = max(0, i - 10)
                      end = min(len(lines), i + 35)
                      block = ''.join(lines[start:end])
                      if block not in seen_blocks:
                          seen_blocks.add(block)
                          collected.append(f'=== Gradle Log Match (line {i}) ===\n' + block)

          if not collected and os.path.exists('gradle_build.log'):
              collected.append('=== Last 300 Lines of gradle_build.log ===\n' + ''.join(open('gradle_build.log', 'r', errors='ignore').readlines()[-300:]))

          full_body = '\n\n'.join(collected)[:60000] if collected else 'No error logs captured'
          body = f'### CI Build Failure Diagnostics ({sha})\n\`\`\`\n{full_body}\n\`\`\`'
          url = f'https://api.github.com/repos/{repo}/commits/{sha}/comments'
          req = urllib.request.Request(
              url,
              data=json.dumps({'body': body}).encode('utf-8'),
              headers={
                  'Authorization': f'token {token}',
                  'Accept': 'application/vnd.github.v3+json',
                  'User-Agent': 'CI-Failure-Reporter'
              }
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print('Posted failure diagnostics to commit comment, status:', resp.status)
          except Exception as e:
              print('Failed to post commit comment:', e)
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate and Prepare APK
        run: |
          echo "Looking for built APKs..."
          find . -name "*.apk" -type f || true

          APK_PATH=$(find . -name "*.apk" -type f ! -path "*/intermediates/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found after build!"
            if [ -f gradle_build.log ]; then
              echo "=== LAST 200 LINES OF GRADLE LOG ==="
              tail -n 200 gradle_build.log
            fi
            exit 1
          fi
          echo "Selected APK: $APK_PATH"
          cp "$APK_PATH" Opengram.apk
          ls -lh Opengram.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          name: Opengram ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          files: Opengram.apk
          body: |
            ### Opengram Release

            Download **Opengram.apk** below and install it on Android 7.0 or later.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
