name: Build and Release Opengram APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.3'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Opengram
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Free Disk Space & Configure Swap
        run: |
          sudo fallocate -l 6G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=6144 || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          free -h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Install Components
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="sdkmanager"; fi
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Checkout Build Dependencies
        run: |
          set -euxo pipefail
          # media3 must be checked out from the Telegram-compatible fork/branch.
          git clone --depth 1 --branch telegram-v1.10.1-ffmpeg https://github.com/Arseny271/media.git TMessagesProj_Modules/media
          # Pin tgcalls to a known upstream revision; native CMake depends on its Android and audio helper sources.
          git clone https://github.com/TelegramMessenger/tgcalls.git TMessagesProj/jni/tgcalls
          git -C TMessagesProj/jni/tgcalls checkout --detach 38dcea121f10638c42098f226f05c298a392f95c
          test -f TMessagesProj/jni/tgcalls/tgcalls/AudioDeviceHelper.cpp
          test -f TMessagesProj/jni/tgcalls/tgcalls/platform/android/AndroidInterface.cpp
          git clone --depth 1 https://github.com/dkaraush/jlatexmath-android.git TMessagesProj/lib/jlatexmath
          git clone --depth 1 https://chromium.googlesource.com/libyuv/libyuv TMessagesProj/jni/third_party/libyuv
          git clone --depth 1 https://github.com/abseil/abseil-cpp.git TMessagesProj/jni/third_party/absl
          test -f TMessagesProj_Modules/media/core_settings.gradle

      - name: Generate CI Release Keystore
        run: |
          keytool -genkey -v -keystore Your_Key.jks \
            -alias Your_Alias -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass Your_Password -keypass Your_Password \
            -dname "CN=Opengram, OU=Opengram, O=Opengram, L=City, S=State, C=US"

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Standalone APK
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC" \
            -Pandroid.nativeBuild.parallelLevel=2 \
            2>&1 | tee gradle_build.log || {
              echo "Standalone build encountered an issue; checking debug variant or details..."
              tail -n 200 gradle_build.log
              ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug --stacktrace \
                --no-daemon \
                -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC" \
                -Pandroid.nativeBuild.parallelLevel=2 \
                2>&1 | tee -a gradle_build.log || {
                  echo "=== BUILD FAILED: LAST 200 LINES OF LOG ==="
                  tail -n 200 gradle_build.log
                  exit 1
                }
            }

      - name: Locate and Prepare APK
        run: |
          set -euo pipefail
          APK_PATH=$(find TMessagesProj_AppStandalone/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Searching all project modules for output APK..."
            APK_PATH=$(find . -path "*/build/outputs/apk/*" -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          test -n "$APK_PATH"
          cp "$APK_PATH" Opengram.apk
          ls -lh Opengram.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          name: Opengram ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          files: Opengram.apk
          body: |
            ### Opengram Release

            Download **Opengram.apk** below and install it on Android 7.0 or later.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
